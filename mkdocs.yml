site_name: Orbit Lab Documentation
site_description: Official engineering documentation for Orbit Lab
site_author: Orbit Lab
site_url: https://the-orbit-lab.github.io/docs/

repo_name: the-orbit-lab/docs
repo_url: https://github.com/the-orbit-lab/docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: en

  features:
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Home: index.md

  - Standards:
      - Overview: standards/index.md
      - Documentation Standard: standards/orbit-std-001-documentation-standard.md
      - Identification Standard: standards/orbit-std-002-identification-standard.md
      - File Naming Standard: standards/orbit-std-003-file-naming-standard.md
      - Revision Control Standard: standards/orbit-std-004-revision-control.md
      - Readme Standard: standards/orbit-std-005-readme-standard.md

  - Guides:
      - Overview: guides/index.md
      - Engineering Artifact Types: guides/engineering-artifact-types.md

  - Registers:
      - registers/index.md
      - Document Register: registers/document-register.md

  - Engineering Templates:
      - Overview: engineering-templates/index.md
      - ADR: engineering-templates/adr-template.md
      - Requirement: engineering-templates/requirement-template.md
      - Verification Test: engineering-templates/verification-test-template.md
      - Experiment: engineering-templates/experiment-template.md
      - Interface: engineering-templates/interface-template.md
      - Engineering Log Template: engineering-templates/engineering-log-template.md